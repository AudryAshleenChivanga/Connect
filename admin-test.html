<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        input, button { margin: 5px; padding: 8px; }
    </style>
</head>
<body>
    <h1>Admin Login Test</h1>

    <div class="test-section info">
        <h3>Current Admin Credentials:</h3>
        <p><strong>Username:</strong> admin</p>
        <p><strong>Password:</strong> ashletech2025</p>
    </div>

    <div class="test-section">
        <h3>LocalStorage Test:</h3>
        <button onclick="checkLocalStorage()">Check Stored Auth Data</button>
        <button onclick="clearLocalStorage()">Clear Auth Data</button>
        <div id="storage-result"></div>
    </div>

    <div class="test-section">
        <h3>Login Test:</h3>
        <input type="text" id="test-username" placeholder="Username" value="admin">
        <input type="password" id="test-password" placeholder="Password" value="ashletech2025">
        <button onclick="testLogin()">Test Login</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h3>Direct Links:</h3>
        <a href="admin.html" target="_blank">Open Admin Panel</a> |
        <a href="index.html" target="_blank">Open Main Site</a>
    </div>

    <script>
        function checkLocalStorage() {
            const authData = localStorage.getItem('admin_auth');
            const result = document.getElementById('storage-result');

            if (authData) {
                try {
                    const auth = JSON.parse(authData);
                    const expiryDate = new Date(auth.expiry);
                    const now = new Date();

                    result.innerHTML = `
                        <div class="success">
                            <strong>Auth Data Found:</strong><br>
                            Logged In: ${auth.loggedIn}<br>
                            User: ${auth.user ? auth.user.username : 'None'}<br>
                            Expiry: ${expiryDate.toLocaleString()}<br>
                            Expired: ${auth.expiry < Date.now() ? 'YES' : 'NO'}<br>
                            Current Time: ${now.toLocaleString()}
                        </div>
                    `;
                } catch (e) {
                    result.innerHTML = `<div class="error">Error parsing auth data: ${e.message}</div>`;
                }
            } else {
                result.innerHTML = `<div class="info">No auth data found in localStorage</div>`;
            }
        }

        function clearLocalStorage() {
            localStorage.removeItem('admin_auth');
            document.getElementById('storage-result').innerHTML = `<div class="success">Auth data cleared</div>`;
        }

        function testLogin() {
            const username = document.getElementById('test-username').value;
            const password = document.getElementById('test-password').value;
            const result = document.getElementById('login-result');

            if (username === 'admin' && password === 'ashletech2025') {
                // Simulate successful login
                const authData = {
                    loggedIn: true,
                    user: { username: 'admin' },
                    expiry: Date.now() + (24 * 60 * 60 * 1000) // 24 hours
                };
                localStorage.setItem('admin_auth', JSON.stringify(authData));

                result.innerHTML = `<div class="success">✅ Login successful! Auth data stored.</div>`;
            } else {
                result.innerHTML = `<div class="error">❌ Invalid credentials. Expected: admin / ashletech2025</div>`;
            }
        }

        // Auto-check on load
        window.addEventListener('load', checkLocalStorage);
    </script>
</body>
</html>
